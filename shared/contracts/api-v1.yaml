# All members: canonical OpenAPI v1 contract; implementations and clients MUST preserve these paths, fields, and response types.
# Member 1 owns voice endpoints; Member 2 owns ask/history/status; Member 3 owns search/frames.
openapi: 3.0.3
info:
  title: Multimedia Visual Assistant - Shared API
  version: 1.2.0
  description: API shapes shared across the independently developed Mobile, Web AI and Multimedia services.
servers:
  - url: http://localhost:8002
    description: Illustrative development host; service origins are configured separately.
paths:
  /api/v1/ocr:
    post:
      summary: Internal memory-only PaddleOCR on loopback port 8004.
      description: Use the requested language model. Never expose this worker directly to phones or the Internet.
      parameters:
        - in: query
          name: lang
          schema: {type: string, enum: [en, ar, fr], default: en}
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: {type: string, format: binary}
          image/png:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Existing OCRResult fields plus status and confidence. Unclear or no_text always has empty text.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OCRResult'}
        '413': {description: Image exceeds 4 MiB.}
        '422': {description: Invalid image or language.}
        '429': {description: OCR busy.}
        '503': {description: OCR unavailable or models loading.}
  /api/v1/live-voice/start:
    post:
      summary: Start a caregiver call to a live phone session owned by the signed-in account.
      description: Requires the existing session cookie. Separate caregiver roles do not exist in this version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: {type: string, format: uuid}
      responses:
        '200':
          description: One-use dashboard signaling ticket, valid for 20 seconds.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LiveCallTicket'}
        '401': {description: Login required.}
        '403': {description: Phone session not active or owned by this account.}
        '409': {description: This account already has a call.}
  /api/v1/live-voice/pending:
    get:
      summary: Phone polls for its own pending call.
      parameters:
        - in: query
          name: session_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: A call descriptor or null.
          content:
            application/json:
              schema:
                type: object
                required: [call]
                properties:
                  call:
                    type: object
                    nullable: true
                    properties:
                      call_id: {type: string, format: uuid}
                      caller_name: {type: string}
        '401': {description: Login required.}
  /api/v1/live-voice/{call_id}/join:
    post:
      summary: Obtain a one-use phone signaling ticket for an owned call.
      parameters:
        - in: path
          name: call_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: One-use phone ticket, valid for 20 seconds.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LiveCallTicket'}
        '401': {description: Login required.}
        '404': {description: Call missing or belongs to another account.}
  /api/v1/live-voice/{call_id}/end:
    post:
      summary: End an owned call and close both signaling peers.
      parameters:
        - in: path
          name: call_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: 'JSON ok true.'}
        '401': {description: Login required.}
        '404': {description: Call missing or belongs to another account.}
  /api/v1/live-voice/signal:
    get:
      summary: WebSocket upgrade for authenticated signaling only.
      description: >-
        First JSON frame is LiveCallTicket, never put the ticket in the URL.
        A consumed or expired ticket closes with 4401; duplicate role closes 4409.
        Server sends ready when both peers attach. Dashboard sends offer with sdp;
        phone sends answer with sdp; both exchange ice with candidate object.
        Clients send ping every 10 seconds; server replies pong. Missing heartbeat
        or a disconnected peer ends both sides. There is no maximum live duration.
        Audio is direct DTLS-SRTP WebRTC, not a WebSocket recording. Single backend
        worker only; no TURN configuration in this LAN-first version.
        The retired /api/v1/notes endpoints return 404; old database rows remain.
      responses:
        '101': {description: WebSocket established; first-frame authentication required.}
  /health:
    get:
      summary: Each backend provides a basic health check.
      responses:
        '200':
          description: Service is responding.
  /api/v1/voice/health:
    get:
      summary: Local model readiness (authenticated through backend; internal port 8001 is loopback-only).
      responses:
        '200':
          description: TTS and STT models ready; languages en, ar, fr; audio_storage memory_only.
        '503':
          description: Models loading or unavailable.
  /api/v1/voice/tts:
    post:
      summary: Supertonic 3 speech synthesized entirely in memory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: {type: string, minLength: 1, maxLength: 2000}
                lang: {type: string, enum: [en, ar, fr], default: en}
                speed: {type: number, minimum: 0.7, maximum: 2, default: 1}
      responses:
        '200':
          description: Mono PCM16 WAV; Cache-Control no-store.
          content:
            audio/wav:
              schema: {type: string, format: binary}
        '401': {description: Sign in through the backend first.}
        '422': {description: 'Invalid request; error contains code and message.'}
        '429': {description: 'Model busy; error contains code and message.'}
        '503': {description: 'Voice unavailable; use explicit device fallback.'}
  /api/v1/voice/stt:
    post:
      summary: Faster-whisper multilingual transcription, up to 20 seconds and 2 MiB; RAM only.
      parameters:
        - in: query
          name: lang
          schema: {type: string, enum: [en, ar, fr], default: en}
          description: Used for raw audio bodies; multipart uses its own lang field.
      requestBody:
        required: true
        content:
          audio/wav:
            schema: {type: string, format: binary}
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: {type: string, format: binary}
                lang: {type: string, enum: [en, ar, fr], default: en}
      responses:
        '200':
          description: Final transcription; empty text means no speech was transcribed and must not be submitted as a question.
          content:
            application/json:
              schema:
                type: object
                required: [text, lang]
                properties:
                  text: {type: string}
                  lang: {type: string, enum: [en, ar, fr]}
        '401': {description: Sign in through the backend first.}
        '413': {description: 'Body or duration too large; error contains code and message.'}
        '415': {description: 'Unsupported content type; error contains code and message.'}
        '422': {description: 'Invalid audio or language; error contains code and message.'}
        '429': {description: 'Model busy; error contains code and message.'}
        '503': {description: 'Voice unavailable; use explicit device fallback.'}
  /api/v1/voice/synthesize:
    post:
      deprecated: true
      summary: Compatibility alias for old dashboards; now returns WAV with the correct MIME type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, minLength: 1, maxLength: 2000}
                language: {type: string, enum: [en, ar, fr], default: en}
      responses:
        '200':
          description: PCM WAV audio.
          content:
            audio/wav:
              schema: {type: string, format: binary}

  /api/v1/ask:
    post:
      summary: Member 2 uses retrieved visual evidence to answer recognized question text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: Grounded answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
  /api/v1/search:
    post:
      summary: Member 3 searches the stored frames by time and meaning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Ranked frames; an empty frames array means no match.
          content:
            application/json:
              schema:
                type: object
                required: [frames]
                properties:
                  frames:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchFrame'
  /api/v1/frames:
    get:
      summary: Member 3 returns paginated frames for the dashboard timeline.
      parameters:
        - {name: session_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, required: false, schema: {type: integer, default: 20, minimum: 1, maximum: 100}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Saved frames ordered newest-first.
          content:
            application/json:
              schema:
                type: object
                required: [frames, next_cursor]
                properties:
                  frames:
                    type: array
                    items:
                      $ref: '#/components/schemas/Frame'
                  next_cursor:
                    type: string
                    nullable: true
  /api/v1/frames/{frame_id}/image:
    get:
      summary: Member 3 serves a protected stored JPEG by frame ID.
      parameters:
        - {name: frame_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: JPEG bytes.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Frame absent, inaccessible or expired.
  /api/v1/questions:
    get:
      summary: Member 2 returns paginated spoken-question history.
      parameters:
        - {name: session_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, required: false, schema: {type: integer, default: 20, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Questions and answers newest-first.
          content:
            application/json:
              schema:
                type: object
                required: [questions, next_cursor]
                properties:
                  questions:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuestionRecord'
                  next_cursor:
                    type: string
                    nullable: true
  /api/v1/status:
    get:
      summary: Member 2 aggregates streaming, multimedia, and AI status for the dashboard.
      parameters:
        - {name: session_id, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Status of all three components.
          content:
            application/json:
              schema:
                type: object
                required: [streaming, multimedia, ai]
                properties:
                  streaming: {$ref: '#/components/schemas/ServiceStatus'}
                  multimedia: {$ref: '#/components/schemas/ServiceStatus'}
                  ai: {$ref: '#/components/schemas/ServiceStatus'}
components:
  schemas:
    OCRResult:
      type: object
      required: [text, model, has_text, raw_markdown, status, confidence]
      properties:
        text: {type: string}
        raw_markdown: {type: string}
        model: {type: string}
        has_text: {type: boolean}
        status: {type: string, enum: [ok, unclear, no_text]}
        confidence: {type: number, minimum: 0, maximum: 1}
    LiveCallTicket:
      type: object
      required: [call_id, caller_name, ticket]
      properties:
        call_id: {type: string, format: uuid}
        caller_name: {type: string}
        ticket: {type: string, description: 'One use; 20 seconds; never log or persist.'}
    ServiceStatus:
      type: string
      enum: [online, connecting, offline, error]
    AskRequest:
      type: object
      required: [session_id, question_id, question, language]
      properties:
        session_id: {type: string, format: uuid}
        question_id: {type: string, format: uuid}
        question: {type: string}
        language: {type: string, enum: [en, ar, fr]}
    AskResponse:
      type: object
      required: [question_id, answer, language, uncertain, evidence_frame_ids]
      properties:
        question_id: {type: string, format: uuid}
        answer: {type: string}
        language: {type: string, enum: [en, ar, fr]}
        uncertain: {type: boolean}
        evidence_frame_ids:
          type: array
          items: {type: string, format: uuid}
    SearchRequest:
      type: object
      required: [session_id, query, mode, limit]
      properties:
        session_id: {type: string, format: uuid}
        query: {type: string}
        mode: {type: string, enum: [latest, recent, history]}
        limit: {type: integer, minimum: 1, maximum: 20}
    Frame:
      type: object
      required: [frame_id, session_id, captured_at, image_url, caption, ocr_text, objects]
      properties:
        frame_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        captured_at: {type: string, format: date-time}
        image_url: {type: string}
        caption: {type: string}
        ocr_text: {type: string}
        objects:
          type: array
          items: {type: string}
    SearchFrame:
      allOf:
        - $ref: '#/components/schemas/Frame'
        - type: object
          required: [relevance_score]
          properties:
            relevance_score: {type: number, minimum: 0, maximum: 1}
    QuestionRecord:
      type: object
      required: [question_id, asked_at, question, answer, language]
      properties:
        question_id: {type: string, format: uuid}
        asked_at: {type: string, format: date-time}
        question: {type: string}
        answer: {type: string}
        language: {type: string, enum: [en, ar, fr]}
