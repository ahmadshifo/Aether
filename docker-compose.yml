name: aether-local
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports: ["127.0.0.1:3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run node scripts/configure-local.mjs}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aether_multimedia}
      MYSQL_USER: ${MYSQL_USER:-aether}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  rustfs:
    image: rustfs/rustfs:1.0.7
    restart: unless-stopped
    command: ["/data"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes: ["rustfs_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
  storage-init:
    build: ./mobile/voice-service
    image: aether-local-voice:1
    command: ["python", "-m", "app.init_storage"]
    environment:
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-aether-frames}
    depends_on:
      rustfs: {condition: service_healthy}
  voice-stt:
    build: ./mobile/voice-service
    image: aether-local-voice:1
    restart: unless-stopped
    environment:
      VOICE_ROLE: stt
      STT_MODEL: ${STT_MODEL:-small}
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
      VOICE_THREADS: ${VOICE_THREADS:-4}
    volumes: ["voice_models:/models"]
    tmpfs: ["/tmp:size=64m"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/voice/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30m
  voice-tts:
    image: aether-local-voice:1
    build: ./mobile/voice-service
    restart: unless-stopped
    ports: ["127.0.0.1:8001:8001"]
    environment:
      VOICE_ROLE: tts
      STT_URL: http://voice-stt:8001
      TTS_VOICE: ${TTS_VOICE:-F1}
      VOICE_THREADS: ${VOICE_THREADS:-4}
    volumes: ["voice_models:/models"]
    tmpfs: ["/tmp:size=64m"]
    depends_on:
      voice-stt: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/voice/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30m
volumes:
  mysql_data:
  rustfs_data:
  voice_models:
