name: aether-multimedia-db

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_USER: ${MYSQL_USER:-multimedia_user}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aether_multimedia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in api/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in api/.env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - multimedia_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/001-multimedia.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" -D \"$${MYSQL_DATABASE}\" -Nse 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

volumes:
  multimedia_mysql_data:
