<!doctype html>
<!-- Member 2: HTML shell for the live-stream, image timeline, answer history and status dashboard. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a1a23" />
    <title>echosight · Dashboard</title>
    <!-- Member 2: apply the saved light/dark choice before first paint to avoid a flash of the wrong theme. -->
    <script>
      try {
        var saved = localStorage.getItem('echosight-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
